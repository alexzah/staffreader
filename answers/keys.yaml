# The answer keys the ladder cases score against: what each is, where it
# came from and under what terms. They are published as one zip on a
# GitHub release (staffreader fetch downloads it and checks its checksum),
# never in git. scripts/build_answer_keys.py makes the zip from the files
# named under `from`, which are on the maintainer's machine, applying any
# corrections, each read from the printed page named.
#
# The keys are dedicated to the public domain (CC0-1.0) as far as any
# right in them is ours; each source's own terms are given.

petzold-minuet:
  title: Petzold, Minuet in G
  source: MuseScore.com, transcribed by Marc Sabatella, in PDMX
  url: https://musescore.com/user/2975/scores/5653587
  license: CC0-1.0
  from: {scores: bundles/petzold-minuet/score.musicxml}

