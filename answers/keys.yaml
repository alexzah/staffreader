arabesque-1:
  title: Debussy, Arabesque No. 1, L. 66
  source: MuseScore.com, "Debussy Première Arabesque, L. 66, No. 1", transcribed by hmscomp, in PDMX
  url: https://musescore.com/user/24069/scores/5077352
  license: CC0-1.0
  from: {pdmx: mxl/10/25/QmSiufNxXsLotuQDJMEjTj3AbLr5H4K3mfB4LbjeB6UwTm.mxl}
  # Read from Durand's print (IMSLP 2821), the scan of the ladder pages,
  # 2026-10-14. Bars count from the first; onsets are in quarter notes.
  corrections:
    - {bar: 12, onset: 1, pitch: E4, tie: start}
    - {bar: 12, onset: 2, pitch: E4, tie: stop}
    - {bar: 23, onset: 8/3, pitch: G#3, to: A3}
    - {bar: 64, onset: 1, pitch: G#3, to: G3, accidental: natural}
    - {bar: 82, onset: 1, pitch: E4, tie: start}
    - {bar: 82, onset: 2, pitch: E4, tie: stop}
    - {bar: 99, onset: 10/3, pitch: E5, to: B5}
  # The transcription adds marks for playback that the print does not show
  # (pedaling throughout, tempo changes, extra dynamics), so the cases
  # that use it leave those families unscored (their masks).

