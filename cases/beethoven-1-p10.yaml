# Beethoven, Symphony No. 1, I, page 10 of the Eulenburg score (ed. Unger)
# the OpenScore transcription was made from (IMSLP 13842): bars 73-84,
# checked by the printed bar number 80. The first system prints ten
# staves and the second six, leaving out those with nothing to play, so a
# staff's instrument has to be read from its label, not its place. Each
# wind staff holds two players and the cellos share theirs with the
# basses, which the transcription writes apart. This volume is held out of
# training.
