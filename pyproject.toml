[project]
name = "staffreader"
version = "0.1.0"
description = "Optical music recognition trained only on free data, proved bar by bar against scores whose answer is known."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "music21>=10.5",
    "musicdiff>=6.0",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11",
    "pyyaml>=6",
    "requests>=2.32",
    "scipy>=1.18.1",
    "torch>=2.8",
]

[project.scripts]
staffreader = "staffreader.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staffreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs MuseScore"]

# PyTorch built for CUDA 12.8, which runs on the RTX 3080's driver.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
